<style>
/* Layout concept: a phone-first app shell. Dark brand bar on top, four tabs on the bottom,
   one scrolling column in between. Count cards open one at a time (accordion). */
:root {
  --bg: #0e0d0c;
  --bg-2: #161412;
  --surface: #1c1a18;
  --surface-2: #262321;
  --line: #34302c;
  --fg: #f6f1ea;
  --muted: #aaa298;
  --faint: #756e66;
  --accent: #f2431b;
  --accent-2: #ff7a4d;
  --on-accent: #ffffff;
  --good: #3cc47c;
  --warn: #f4b63f;
  --bad: #ff5a78;
  --good-bg: rgba(60, 196, 124, .14);
  --warn-bg: rgba(244, 182, 63, .15);
  --bad-bg: rgba(255, 90, 120, .15);
  --accent-bg: rgba(242, 67, 27, .16);
  --bar: #100f0e;
  --bar-fg: #f6f1ea;
  --shadow: 0 10px 28px rgba(0, 0, 0, .45);
  --f-display: 'Kanit', 'Noto Sans Thai', 'Thonburi', system-ui, sans-serif;
  --f-body: 'Noto Sans Thai', 'Kanit', 'Thonburi', system-ui, sans-serif;
  color-scheme: dark;
}
@media (prefers-color-scheme: light) {
  :root:not([data-theme="dark"]) {
    --bg: #f3f2ef; --bg-2: #eae8e4; --surface: #ffffff; --surface-2: #f6f4f1; --line: #e0dcd6;
    --fg: #1c1a18; --muted: #675f57; --faint: #968f87;
    --accent: #e03410; --accent-2: #f2431b;
    --good: #0f8656; --warn: #a96a06; --bad: #cf2247;
    --good-bg: rgba(15, 134, 86, .11); --warn-bg: rgba(169, 106, 6, .12); --bad-bg: rgba(207, 34, 71, .10);
    --accent-bg: rgba(224, 52, 16, .10);
    --shadow: 0 10px 28px rgba(40, 30, 20, .16);
    color-scheme: light;
  }
}
:root[data-theme="light"] {
  --bg: #f3f2ef; --bg-2: #eae8e4; --surface: #ffffff; --surface-2: #f6f4f1; --line: #e0dcd6;
  --fg: #1c1a18; --muted: #675f57; --faint: #968f87;
  --accent: #e03410; --accent-2: #f2431b;
  --good: #0f8656; --warn: #a96a06; --bad: #cf2247;
  --good-bg: rgba(15, 134, 86, .11); --warn-bg: rgba(169, 106, 6, .12); --bad-bg: rgba(207, 34, 71, .10);
  --accent-bg: rgba(224, 52, 16, .10);
  --shadow: 0 10px 28px rgba(40, 30, 20, .16);
  color-scheme: light;
}

* { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
html, body { background: var(--bg); color: var(--fg); }
body { font-family: var(--f-body); font-size: 15px; line-height: 1.5; margin: 0; -webkit-text-size-adjust: 100%; }
button, input, select, textarea { font: inherit; color: inherit; }
button { cursor: pointer; background: none; border: 0; padding: 0; }
img { display: block; }
h1, h2, h3, p { margin: 0; }
:focus-visible { outline: 2px solid var(--accent-2); outline-offset: 2px; }
.num { font-family: var(--f-display); font-variant-numeric: tabular-nums; }
.sr { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; }

#app { max-width: 560px; margin-inline: auto; min-height: 100vh; }
.wrap { padding-inline: 16px; }

/* ---------- brand bar ---------- */
.bar-top {
  position: sticky; top: env(safe-area-inset-top, 0px); z-index: 20;
  background: var(--bar); color: var(--bar-fg);
  border-bottom: 1px solid #2a2622;
}
.bar-in { display: flex; align-items: center; gap: 12px; padding: 8px 16px; min-height: 60px; }
.brand { display: flex; align-items: center; gap: 10px; min-width: 0; flex: 1; }
.brand img { width: 52px; height: 38px; object-fit: contain; flex: none; }
.brand b { font-family: var(--f-display); font-weight: 600; font-size: 18px; letter-spacing: .01em; white-space: nowrap; }
.brand small { display: block; color: #a8a097; font-size: 11px; line-height: 1.2; }
.sync { display: inline-flex; align-items: center; gap: 6px; font-size: 12px; color: #c9c1b7; padding: 4px 10px; border-radius: 999px; background: #1f1c1a; white-space: nowrap; }
.sync i { width: 8px; height: 8px; border-radius: 50%; background: var(--good); flex: none; }
.sync.busy i { background: var(--warn); animation: pulse 1s infinite; }
.sync.local i { background: #8d857c; }
.sync.err i { background: var(--bad); }
@keyframes pulse { 50% { opacity: .35; } }
.icon-btn { width: 44px; height: 44px; display: grid; place-items: center; border-radius: 12px; color: inherit; flex: none; }
.icon-btn:active { background: rgba(255, 255, 255, .08); }
.icon-btn svg { width: 22px; height: 22px; }

/* ---------- tab bar ---------- */
.tabs {
  position: fixed; bottom: 0; left: 50%; transform: translateX(-50%); width: min(100%, 560px); z-index: 30;
  display: grid; grid-template-columns: repeat(4, 1fr);
  background: var(--bar); border-top: 1px solid #2a2622;
  padding-bottom: env(safe-area-inset-bottom, 0px);
}
.tab { display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 3px; min-height: 62px; color: #9a9289; font-size: 12px; font-weight: 500; position: relative; }
.tab svg { width: 24px; height: 24px; }
.tab[aria-current="page"] { color: #fff; background: var(--accent); }
.tab .dot { position: absolute; top: 8px; right: calc(50% - 22px); min-width: 18px; height: 18px; padding: 0 5px; border-radius: 9px; background: var(--bad); color: #fff; font-size: 11px; font-weight: 600; display: grid; place-items: center; }
main#view { padding-block: 16px 104px; display: flex; flex-direction: column; gap: 20px; }

/* ---------- typography ---------- */
.h-sec { font-family: var(--f-display); font-weight: 600; font-size: 18px; display: flex; align-items: baseline; justify-content: space-between; gap: 8px; text-wrap: balance; }
.h-sec small { font-family: var(--f-body); font-weight: 400; font-size: 13px; color: var(--muted); }
.muted { color: var(--muted); }
.cap { font-size: 12px; color: var(--muted); }
.eyebrow { font-size: 12px; letter-spacing: .06em; text-transform: uppercase; color: var(--muted); font-weight: 600; }

/* ---------- buttons, chips ---------- */
.btn { display: inline-flex; align-items: center; justify-content: center; gap: 8px; min-height: 46px; padding: 0 20px; border-radius: 12px; font-weight: 600; background: var(--accent); color: var(--on-accent); font-family: var(--f-display); font-size: 16px; letter-spacing: .01em; }
.btn:active { filter: brightness(.9); }
.btn.ghost { background: transparent; color: var(--fg); border: 1.5px solid var(--line); }
.btn.soft { background: var(--accent-bg); color: var(--accent-2); }
.btn.danger { background: transparent; color: var(--bad); border: 1.5px solid var(--bad); }
.btn.sm { min-height: 40px; padding: 0 14px; font-size: 14px; border-radius: 10px; }
.btn.block { width: 100%; }
.btn[disabled] { opacity: .45; pointer-events: none; }
.btn svg { width: 20px; height: 20px; }
.pill { display: inline-flex; align-items: center; gap: 4px; padding: 2px 10px; border-radius: 999px; font-size: 12px; font-weight: 600; line-height: 1.6; white-space: nowrap; background: var(--surface-2); color: var(--muted); }
.pill.good { background: var(--good-bg); color: var(--good); }
.pill.warn { background: var(--warn-bg); color: var(--warn); }
.pill.bad { background: var(--bad-bg); color: var(--bad); }
.pill.acc { background: var(--accent-bg); color: var(--accent-2); }
.chips { display: flex; gap: 8px; overflow-x: auto; padding-bottom: 2px; scrollbar-width: none; }
.chips::-webkit-scrollbar { display: none; }
.chip { flex: none; min-height: 40px; padding: 0 16px; border-radius: 999px; border: 1.5px solid var(--line); font-size: 14px; font-weight: 500; color: var(--muted); display: inline-flex; align-items: center; gap: 6px; }
.chip[aria-pressed="true"], .chip.on { background: var(--fg); color: var(--bg); border-color: var(--fg); }
.seg { display: grid; grid-auto-flow: column; grid-auto-columns: 1fr; background: var(--bg-2); border: 1px solid var(--line); border-radius: 12px; padding: 3px; gap: 3px; }
.seg button { min-height: 40px; border-radius: 9px; font-weight: 600; color: var(--muted); font-size: 14px; }
.seg button[aria-pressed="true"] { background: var(--accent); color: #fff; }

/* ---------- hero ---------- */
.hero { position: relative; border-radius: 20px; overflow: hidden; background-color: #000; background-size: cover; background-position: center 16%; color: #fff; padding: 18px; min-height: 212px; display: flex; flex-direction: column; justify-content: flex-end; gap: 12px; isolation: isolate; }
.hero::before { content: ''; position: absolute; inset: 0; z-index: -1; background: linear-gradient(180deg, rgba(14, 13, 12, .18) 0%, rgba(14, 13, 12, .62) 52%, rgba(14, 13, 12, .94) 100%); }
.hero .date { font-size: 13px; color: #e9e1d6; }
.hero h1 { font-family: var(--f-display); font-weight: 700; font-size: 26px; line-height: 1.2; text-wrap: balance; }
.meter { height: 8px; border-radius: 4px; background: rgba(255, 255, 255, .22); overflow: hidden; }
.meter > i { display: block; height: 100%; background: var(--accent-2); border-radius: 4px; transition: width .3s; }
.hero-row { display: flex; align-items: center; justify-content: space-between; gap: 12px; flex-wrap: wrap; }

/* ---------- stats ---------- */
.stats { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 8px; }
.stat { background: var(--surface); border: 1px solid var(--line); border-radius: 14px; padding: 12px; min-width: 0; }
.stat .v { font-family: var(--f-display); font-weight: 600; font-size: 20px; line-height: 1.2; overflow-wrap: anywhere; }
.stat .l { font-size: 12px; color: var(--muted); margin-top: 2px; }
.stat.good .v { color: var(--good); } .stat.bad .v { color: var(--bad); } .stat.warn .v { color: var(--warn); }

/* ---------- lists ---------- */
.rows { display: flex; flex-direction: column; }
.row { display: flex; align-items: center; gap: 12px; padding: 12px 0; border-bottom: 1px solid var(--line); min-width: 0; }
.row:last-child { border-bottom: 0; }
.row .grow { flex: 1; min-width: 0; }
.row .t { font-weight: 600; overflow-wrap: anywhere; }
.row .s { font-size: 13px; color: var(--muted); }
.thumb { width: 52px; height: 52px; border-radius: 12px; object-fit: cover; background: #000; flex: none; }
.thumb.sm { width: 40px; height: 40px; border-radius: 10px; }
.empty { border: 1.5px dashed var(--line); border-radius: 16px; padding: 24px 18px; text-align: center; display: flex; flex-direction: column; gap: 10px; align-items: center; color: var(--muted); }
.empty b { color: var(--fg); font-family: var(--f-display); font-weight: 600; font-size: 17px; }
.empty .art { width: 96px; height: 72px; border-radius: 14px; }

.steps { counter-reset: s; display: flex; flex-direction: column; gap: 10px; padding: 0; margin: 0; list-style: none; }
.steps li { counter-increment: s; display: grid; grid-template-columns: 28px 1fr; gap: 10px; font-size: 14px; }
.steps li::before { content: counter(s); width: 28px; height: 28px; border-radius: 50%; background: var(--accent-bg); color: var(--accent-2); display: grid; place-items: center; font-family: var(--f-display); font-weight: 600; }

/* ---------- count tab ---------- */
.datebar { position: sticky; top: calc(60px + env(safe-area-inset-top, 0px)); z-index: 15; background: var(--bg); margin-inline: -16px; padding: 10px 16px 10px; border-bottom: 1px solid var(--line); display: flex; flex-direction: column; gap: 10px; }
.datenav { display: grid; grid-template-columns: 44px 1fr 44px; align-items: center; gap: 6px; }
.datenav .icon-btn { border: 1.5px solid var(--line); color: var(--fg); }
.datepick { position: relative; text-align: center; min-height: 44px; display: grid; place-items: center; border-radius: 12px; background: var(--surface); border: 1px solid var(--line); }
.datepick b { font-family: var(--f-display); font-weight: 600; font-size: 16px; }
.datepick small { display: block; font-size: 12px; color: var(--muted); line-height: 1.2; }
.datepick input { position: absolute; inset: 0; opacity: 0; width: 100%; height: 100%; cursor: pointer; }
.prog { display: flex; align-items: center; gap: 12px; font-size: 13px; color: var(--muted); }
.prog .meter { flex: 1; background: var(--surface-2); }
.prog .meter > i { background: var(--good); }

.cards { display: flex; flex-direction: column; gap: 10px; }
.icard { background: var(--surface); border: 1px solid var(--line); border-radius: 16px; overflow: hidden; }
.icard.open { border-color: var(--accent); }
.ihead { width: 100%; display: flex; align-items: center; gap: 12px; padding: 10px 12px 10px 10px; text-align: left; min-height: 72px; }
.ihead .grow { flex: 1; min-width: 0; }
.ihead .t { font-weight: 600; line-height: 1.3; overflow-wrap: anywhere; }
.ihead .s { font-size: 12px; color: var(--muted); }
.ihead .r { text-align: right; display: flex; flex-direction: column; gap: 4px; align-items: flex-end; }
.ihead .r .cap { white-space: nowrap; }
.ibody { padding: 4px 14px 16px; display: flex; flex-direction: column; gap: 14px; border-top: 1px solid var(--line); }
.fgrid { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 12px 12px; padding-top: 12px; }
.field { min-width: 0; display: flex; flex-direction: column; gap: 4px; }
.field > label, .field > .lab { font-size: 13px; font-weight: 600; display: flex; align-items: center; justify-content: space-between; gap: 6px; }
.field .tag { font-size: 11px; font-weight: 500; color: var(--faint); }
.field .reset { font-size: 11px; font-weight: 600; color: var(--accent-2); text-decoration: underline; min-height: 20px; }
.stepper { display: flex; align-items: center; background: var(--bg-2); border: 1.5px solid var(--line); border-radius: 12px; overflow: hidden; }
.stepper:focus-within { border-color: var(--accent); }
.stepper button { width: 44px; height: 46px; flex: none; font-size: 24px; line-height: 1; color: var(--muted); font-weight: 500; }
.stepper button[data-dir="1"] { color: var(--accent-2); }
.stepper button:active { background: var(--surface-2); }
.stepper input { flex: 1; min-width: 0; width: 100%; height: 46px; border: 0; background: transparent; text-align: center; font-family: var(--f-display); font-size: 19px; font-weight: 500; font-variant-numeric: tabular-nums; outline: none; padding: 0; }
.stepper input::placeholder { color: var(--faint); }
.field .hint { font-size: 11px; color: var(--faint); line-height: 1.35; }
.calc { background: var(--bg-2); border-radius: 14px; padding: 12px; display: flex; flex-direction: column; gap: 12px; }
.calc-line { display: flex; align-items: baseline; justify-content: space-between; gap: 10px; flex-wrap: wrap; }
.calc-line .l { font-size: 13px; color: var(--muted); }
.calc-line .v { font-family: var(--f-display); font-weight: 600; font-size: 22px; }
.calc .formula { font-size: 12px; color: var(--faint); }
.diffbox { border-radius: 12px; padding: 10px 12px; display: flex; align-items: center; justify-content: space-between; gap: 10px; font-weight: 600; background: var(--surface-2); color: var(--muted); }
.diffbox.good { background: var(--good-bg); color: var(--good); }
.diffbox.warn { background: var(--warn-bg); color: var(--warn); }
.diffbox.bad { background: var(--bad-bg); color: var(--bad); }
.diffbox .num { font-size: 22px; }
.diffbox small { display: block; font-weight: 400; font-size: 12px; opacity: .9; }
.match-btn { margin-top: 2px; }

/* ---------- ingredient grid ---------- */
.grid2 { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 12px; }
.gcard { background: var(--surface); border: 1px solid var(--line); border-radius: 16px; overflow: hidden; text-align: left; display: flex; flex-direction: column; min-width: 0; }
.gcard img { width: 100%; aspect-ratio: 4 / 3; object-fit: cover; background: #000; }
.gcard .gb { padding: 10px 12px 12px; display: flex; flex-direction: column; gap: 6px; min-width: 0; flex: 1; }
.gcard .t { font-weight: 600; line-height: 1.3; overflow-wrap: anywhere; }
.gcard .s { font-size: 12px; color: var(--muted); overflow-wrap: anywhere; }
.lvl { height: 6px; background: var(--surface-2); border-radius: 3px; overflow: hidden; }
.lvl i { display: block; height: 100%; border-radius: 3px; background: var(--good); }
.lvl.warn i { background: var(--warn); } .lvl.bad i { background: var(--bad); }
.fab { position: fixed; z-index: 25; right: max(16px, calc(50% - 280px + 16px)); bottom: calc(78px + env(safe-area-inset-bottom, 0px)); width: 58px; height: 58px; border-radius: 50%; background: var(--accent); color: #fff; display: grid; place-items: center; box-shadow: var(--shadow); }
.fab svg { width: 28px; height: 28px; }
.search { display: flex; align-items: center; gap: 8px; background: var(--surface); border: 1.5px solid var(--line); border-radius: 12px; padding: 0 12px; min-height: 46px; }
.search svg { width: 20px; height: 20px; color: var(--muted); flex: none; }
.search input { flex: 1; min-width: 0; border: 0; background: transparent; outline: none; min-height: 44px; }
.search:focus-within { border-color: var(--accent); }

/* ---------- menus ---------- */
.mcard { background: var(--surface); border: 1px solid var(--line); border-radius: 16px; padding: 14px; display: flex; flex-direction: column; gap: 10px; text-align: left; width: 100%; }
.mcard .top { display: flex; align-items: flex-start; justify-content: space-between; gap: 10px; }
.mcard .t { font-family: var(--f-display); font-weight: 600; font-size: 17px; overflow-wrap: anywhere; }
.rc { display: flex; flex-wrap: wrap; gap: 6px; }
.rc span { font-size: 12px; background: var(--bg-2); border-radius: 8px; padding: 3px 8px; color: var(--muted); }
.rc b { color: var(--fg); font-weight: 600; }

/* ---------- reports ---------- */
.tbl { overflow-x: auto; border: 1px solid var(--line); border-radius: 14px; background: var(--surface); }
.tbl table { border-collapse: collapse; width: 100%; min-width: 520px; font-size: 13px; }
.tbl th, .tbl td { padding: 9px 10px; text-align: right; white-space: nowrap; border-bottom: 1px solid var(--line); font-variant-numeric: tabular-nums; }
.tbl th:first-child, .tbl td:first-child { text-align: left; position: sticky; left: 0; background: var(--surface); }
.tbl th { color: var(--muted); font-weight: 600; font-size: 12px; }
.tbl tr:last-child td { border-bottom: 0; }
.tbl td.neg { color: var(--bad); font-weight: 600; } .tbl td.pos { color: var(--warn); font-weight: 600; }
.chartbox { background: var(--surface); border: 1px solid var(--line); border-radius: 14px; padding: 12px 8px 8px; }
.chartbox svg { width: 100%; height: auto; display: block; }
.chartbox text { fill: var(--muted); font-family: var(--f-body); font-size: 10px; }
.legend { display: flex; gap: 14px; padding: 4px 8px 0; font-size: 12px; color: var(--muted); flex-wrap: wrap; }
.legend i { display: inline-block; width: 10px; height: 10px; border-radius: 3px; margin-right: 6px; vertical-align: -1px; }
.hist { display: flex; align-items: center; gap: 10px; width: 100%; padding: 12px 0; border-bottom: 1px solid var(--line); text-align: left; }
.hist:last-child { border-bottom: 0; }

/* ---------- sheet / toast ---------- */
.back { position: fixed; inset: 0; background: rgba(0, 0, 0, .6); z-index: 50; animation: fade .15s; }
.sheet { position: fixed; left: 50%; bottom: 0; transform: translateX(-50%); width: min(100%, 560px); max-height: 92%; overflow-y: auto; overscroll-behavior: contain; z-index: 51; background: var(--surface); color: var(--fg); border-radius: 22px 22px 0 0; padding: 8px 16px calc(18px + env(safe-area-inset-bottom, 0px)); display: flex; flex-direction: column; gap: 14px; animation: up .2s ease-out; box-shadow: var(--shadow); }
.sheet .grab { width: 40px; height: 4px; border-radius: 2px; background: var(--line); margin: 4px auto 0; flex: none; }
.sheet h2 { font-family: var(--f-display); font-weight: 600; font-size: 20px; }
.sheet .sh-head { display: flex; align-items: center; justify-content: space-between; gap: 8px; }
.sheet .actions { display: flex; gap: 10px; }
.sheet .actions .btn { flex: 1; }
@keyframes up { from { transform: translate(-50%, 24px); opacity: .4; } }
@keyframes fade { from { opacity: 0; } }
.inp { width: 100%; min-height: 46px; background: var(--bg-2); border: 1.5px solid var(--line); border-radius: 12px; padding: 0 14px; outline: none; }
.inp:focus { border-color: var(--accent); }
textarea.inp { padding: 10px 14px; min-height: 76px; resize: vertical; }
.lbl { font-size: 13px; font-weight: 600; margin-bottom: 4px; display: block; }
.form { display: flex; flex-direction: column; gap: 14px; }
.two { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 12px; }
.photo { display: grid; grid-template-columns: 112px 1fr; gap: 14px; align-items: center; }
.photo img { width: 112px; height: 84px; border-radius: 14px; object-fit: cover; background: #000; }
.photo .btns { display: flex; flex-direction: column; gap: 8px; }
.rline { display: grid; grid-template-columns: minmax(0, 1fr) 96px 44px; gap: 8px; align-items: center; }
.rline .inp { padding: 0 10px; }
.rline .x { width: 44px; height: 46px; color: var(--bad); display: grid; place-items: center; }
.ptable { display: flex; flex-direction: column; gap: 4px; background: var(--bg-2); border-radius: 12px; padding: 10px 12px; font-size: 13px; }
.ptable div { display: flex; justify-content: space-between; gap: 10px; }
.ptable b { font-weight: 600; }
.pre { white-space: pre-wrap; background: var(--bg-2); border-radius: 12px; padding: 12px; font-size: 14px; line-height: 1.6; max-height: 46vh; overflow: auto; user-select: all; }
#toast { position: fixed; left: 50%; bottom: calc(86px + env(safe-area-inset-bottom, 0px)); transform: translate(-50%, 20px); background: #f6f1ea; color: #1c1a18; padding: 10px 16px; border-radius: 12px; font-size: 14px; font-weight: 500; z-index: 80; opacity: 0; pointer-events: none; transition: .2s; max-width: calc(100% - 32px); box-shadow: var(--shadow); text-align: center; }
#toast.on { opacity: 1; transform: translate(-50%, 0); }
.banner { border-radius: 14px; padding: 12px 14px; font-size: 13px; display: flex; gap: 10px; align-items: flex-start; background: var(--warn-bg); color: var(--fg); border: 1px solid var(--warn); }
.banner b { color: var(--warn); }
.banner.info { background: var(--accent-bg); border-color: transparent; }
.skel { background: linear-gradient(90deg, var(--surface) 25%, var(--surface-2) 50%, var(--surface) 75%); background-size: 200% 100%; animation: sk 1.2s infinite; border-radius: 16px; }
@keyframes sk { to { background-position: -200% 0; } }

@media (prefers-reduced-motion: reduce) {
  *, *::before, *::after { animation: none !important; transition: none !important; }
}
@media (max-width: 360px) {
  .stats { grid-template-columns: 1fr 1fr; }
  .fgrid { gap: 10px; }
  .stepper button { width: 38px; }
}

.sec { display: flex; flex-direction: column; gap: 12px; }
.icard { scroll-margin-top: 150px; }
.hero .date, .hero h1 { text-shadow: 0 1px 8px rgba(0, 0, 0, .55); }
.hero::before { background: linear-gradient(180deg, rgba(14, 13, 12, .38) 0%, rgba(14, 13, 12, .7) 50%, rgba(14, 13, 12, .95) 100%); }
.field > label > span { display: inline-flex; flex-direction: column; align-items: flex-end; gap: 0; text-align: right; }

</style>

/* ---------- helpers ---------- */
const $ = (s, r = document) => r.querySelector(s);
const $$ = (s, r = document) => Array.from(r.querySelectorAll(s));
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
const isNum = v => typeof v === 'number' && isFinite(v);
const n0 = v => (isNum(v) ? v : 0);
const r3 = v => Math.round((v + Number.EPSILON) * 1000) / 1000;
const clone = o => JSON.parse(JSON.stringify(o));
const numStr = v => String(r3(v));
const fmt = (v, max = 2) => (isNum(v) ? r3(v).toLocaleString('en-US', { maximumFractionDigits: max }).replace('-', '−') : '–');
const sgn = v => (!isNum(v) ? '–' : v > 0 ? '+' + fmt(v) : fmt(v));
const money = v => { const x = Math.round(v); return (x < 0 ? '−' : '') + '฿' + Math.abs(x).toLocaleString('en-US'); };
const moneySgn = v => (Math.round(v) > 0 ? '+' : '') + money(v);
const price = v => '฿' + fmt(v, 2);
function parseNum(s) {
  if (s == null) return null;
  s = String(s).trim().replace(/[−–]/g, '-').replace(/,/g, '');
  if (s === '' || s === '-' || s === '.') return null;
  const v = Number(s);
  return isFinite(v) ? v : null;
}

/* ---------- dates (Thai Buddhist calendar, written out so it never depends on ICU) ---------- */
const pad = n => String(n).padStart(2, '0');
const keyOf = d => d.getFullYear() + '-' + pad(d.getMonth() + 1) + '-' + pad(d.getDate());
const todayKey = () => keyOf(new Date());
const parseKey = k => { const [y, m, d] = k.split('-').map(Number); return new Date(y, m - 1, d); };
const addDays = (k, n) => { const d = parseKey(k); d.setDate(d.getDate() + n); return keyOf(d); };
const TH_M = ['ม.ค.', 'ก.พ.', 'มี.ค.', 'เม.ย.', 'พ.ค.', 'มิ.ย.', 'ก.ค.', 'ส.ค.', 'ก.ย.', 'ต.ค.', 'พ.ย.', 'ธ.ค.'];

const dShort = k => { const d = parseKey(k); return d.getDate() + ' ' + TH_M[d.getMonth()] + ' ' + String((d.getFullYear() + 543) % 100).padStart(2, '0'); };
const dDay = k => { const d = parseKey(k); return d.getDate() + '/' + (d.getMonth() + 1); };

/* ---------- write queue (one write at a time per document, coalesced) ---------- */
const wq = new Map();
const isPending = key => { const w = wq.get(key); return !!w && (!!w.timer || w.busy); };
function queueWrite(key, fn) {
  let w = wq.get(key);
  if (!w) { w = { timer: null, busy: false }; wq.set(key, w); }
  w.fn = fn;
  clearTimeout(w.timer);
  w.timer = setTimeout(() => flush(key), 350);
  updateSync();
}
async function flush(key) {
  const w = wq.get(key);
  if (!w) return;
  if (w.busy) { w.timer = setTimeout(() => flush(key), 250); return; }
  w.timer = null; w.busy = true; Store.pending++; updateSync();
  try {
    try { await w.fn(); }
    catch (e) {
      if (e && e.code === 'unavailable') { await new Promise(r => setTimeout(r, 600 + Math.random() * 600)); await w.fn(); }
      else throw e;
    }
    Store.err = false;
  } catch (e) { writeFailed(e); }
  w.busy = false; Store.pending--; updateSync();
}
function writeFailed(e) {
  const code = e && e.code;
  if (code === 'invalid_argument') { Store.canWrite = false; toast('บัญชีนี้บันทึกข้อมูลไม่ได้ (ดูได้อย่างเดียว)'); }
  else if (code === 'quota_exceeded') toast('พื้นที่เก็บข้อมูลเต็ม ลบรายการเก่าที่ไม่ใช้แล้วลองใหม่');
  else { Store.err = true; toast('บันทึกไม่สำเร็จ ตรวจสอบอินเทอร์เน็ตแล้วแก้ไขอีกครั้ง'); }
}
const docOf = (coll, id) => (coll === 'settings' ? S.settings : S[coll][id]);
function persist(coll, id) {
  const key = coll + '/' + id;
  queueWrite(key, async () => {
    if (Store.mode === 'cloud') {
      const d = docOf(coll, id);
      if (d) await Store.db.doc(key).set(JSON.parse(JSON.stringify(d)));
      else await Store.db.doc(key).delete();
    } else {
      lsSave();
    }
  });
}
function lsLoad() { try { const t = localStorage.getItem(LS_KEY); return t ? JSON.parse(t) : null; } catch { return null; } }
function lsSave() { try { localStorage.setItem(LS_KEY, JSON.stringify({ ingredients: S.ingredients, menus: S.menus, days: S.days, settings: S.settings })); } catch { } }
function writable() { if (Store.canWrite) return true; toast('บัญชีนี้ดูได้อย่างเดียว'); return false; }

/* ---------- calculations ---------- */
function calcRow(begin, e) {
  const rec = n0(e.rec), waste = n0(e.waste), test = n0(e.test), pos = n0(e.pos);
  const expected = r3(begin + rec - waste - test - pos);
  const actual = isNum(e.actual) ? e.actual : null;
  return { begin, rec, waste, test, pos, expected, actual, diff: actual == null ? null : r3(actual - expected), posSrc: e.posSrc || null };
}
let ledgerVer = -1, ledgerCache = null;
function getLedger() {
  if (ledgerVer === S.ver && ledgerCache) return ledgerCache;
  const dates = Object.keys(S.days).sort();
  const L = {};
  for (const id in S.ingredients) {
    let carry = null; const by = {}; const ds = [];
    for (const d of dates) {
      const e = S.days[d]?.entries?.[id];
      if (!e) continue;
      const manual = isNum(e.begin);
      const row = calcRow(manual ? e.begin : (carry ?? 0), e);
      row.beginManual = manual; row.beginAuto = !manual && carry != null; row.date = d;
      by[d] = row; ds.push(d);
      carry = row.actual != null ? row.actual : row.expected;
    }
    L[id] = { by, dates: ds, last: ds.length ? by[ds[ds.length - 1]] : null };
  }
  ledgerCache = L; ledgerVer = S.ver;
  return L;
}
function endBefore(id, date) {
  const l = getLedger()[id]; if (!l) return null;
  let end = null;
  for (const d of l.dates) { if (d >= date) break; const r = l.by[d]; end = r.actual != null ? r.actual : r.expected; }
  return end;
}
function rowFor(id, date) {
  const l = getLedger()[id];
  if (l && l.by[date]) return l.by[date];
  const b = endBefore(id, date);
  return { ...calcRow(b ?? 0, {}), beginManual: false, beginAuto: b != null, date, virtual: true };
}
function levelOf(id) { const r = getLedger()[id]?.last; return r ? (r.actual != null ? r.actual : r.expected) : null; }
function diffLevel(row) {
  if (row.diff == null) return 'none';
  if (row.diff === 0) return 'good';
  const base = row.begin + row.rec, tol = n0(S.settings.tolerancePct) / 100;
  return base > 0 && Math.abs(row.diff) <= base * tol ? 'warn' : 'bad';
}
const ingList = (archived = false) => Object.values(S.ingredients)
  .filter(i => !!i.archived === archived)
  .sort((a, b) => (CAT_ORDER[a.cat] ?? 9) - (CAT_ORDER[b.cat] ?? 9) || String(a.id).localeCompare(String(b.id)));
const menuList = () => Object.values(S.menus).filter(m => !m.archived)
  .sort((a, b) => (a.group === b.group ? 0 : a.group === 'burger' ? -1 : 1) || String(a.id).localeCompare(String(b.id)));
const dispName = i => i.nameTh || i.name || i.id;
const subName = i => (i.nameTh && i.name && i.nameTh !== i.name ? i.name : '');
const uLabel = i => UNITS[i.unit]?.label || 'ชิ้น';
const stepOf = i => UNITS[i.unit]?.step || 1;
const ceilTo = (v, s) => Math.ceil(r3(v / s)) * s;
const orderQty = (i, level) => ceilTo(Math.max(0, n0(i.par) - Math.max(0, n0(level))), stepOf(i));
function imgSrc(i) {
  const v = i && i.img;
  if (v && BUILTIN[v]) return BUILTIN[v];
  if (typeof v === 'string' && v.startsWith('art:') && ART[v.slice(4)]) return ART[v.slice(4)];
  if (typeof v === 'string' && v.startsWith('data:image/')) return v;
  return ART[{ B: 'generic', V: 'lettuce', P: 'box' }[i?.cat] || 'generic'] || ART.generic;
}
const imgTag = (i, cls = 'thumb') => `<img class="${cls}" src="${esc(imgSrc(i))}" alt="" loading="lazy">`;
function nextId(cat) {
  let max = 0;
  for (const id in S.ingredients) if (id[0] === cat) max = Math.max(max, parseInt(id.slice(1), 10) || 0);
  return cat + String(max + 1).padStart(3, '0');
}
function nextMenuId() {
  let max = 0;
  for (const id in S.menus) max = Math.max(max, parseInt(id.slice(1), 10) || 0);
  return 'M' + String(max + 1).padStart(3, '0');
}
const hasHistory = id => Object.values(S.days).some(d => d.entries && d.entries[id]);
function menuCost(m) { let c = 0; for (const id in (m.recipe || {})) c += n0(m.recipe[id]) * n0(S.ingredients[id]?.cost); return c; }
function usageFromSales(sales) {
  const use = {};
  for (const mid in sales) {
    const q = n0(sales[mid]), m = S.menus[mid];
    if (!m || q <= 0) continue;
    for (const id in (m.recipe || {})) use[id] = r3((use[id] || 0) + q * n0(m.recipe[id]));
  }
  return use;
}

/* ---------- mutations ---------- */
function patchEntry(date, id, patch) {
  if (!writable()) return false;
  const day = S.days[date] ? clone(S.days[date]) : { date, entries: {}, sales: {} };
  day.entries = day.entries || {};
  const e = { ...(day.entries[id] || {}) };
  for (const k in patch) { if (patch[k] == null) delete e[k]; else e[k] = patch[k]; }
  day.entries[id] = e; day.date = date; day.updatedAt = Date.now();
  S.days[date] = day; S.ver++;
  persist('days', date);
  return true;
}
function applySales(date, sales) {
  if (!writable()) return 0;
  const clean = {}; for (const k in sales) if (n0(sales[k]) > 0) clean[k] = r3(sales[k]);
  const use = usageFromSales(clean);
  const day = S.days[date] ? clone(S.days[date]) : { date, entries: {}, sales: {} };
  day.entries = day.entries || {}; day.sales = clean; day.date = date; day.updatedAt = Date.now();
  let touched = 0;
  for (const i of ingList()) {
    const e = { ...(day.entries[i.id] || {}) };
    if (e.posSrc === 'manual') continue;
    const want = r3(use[i.id] || 0);
    if (want === 0 && e.pos == null) continue;
    if (e.pos !== want) { touched++; }
    e.pos = want; e.posSrc = 'auto';
    day.entries[i.id] = e;
  }
  S.days[date] = day; S.ver++; persist('days', date);
  return touched;
}
function saveSettings(patch) { if (!writable()) return; S.settings = { ...S.settings, ...patch }; S.ver++; persist('settings', 'main'); }
function seedDefaults() {
  if (!writable()) return;
  let added = 0;
  for (const i of DEFAULTS.ingredients) if (!S.ingredients[i.id]) { S.ingredients[i.id] = clone(i); persist('ingredients', i.id); added++; }
  for (const m of DEFAULTS.menus) if (!S.menus[m.id]) { S.menus[m.id] = clone(m); persist('menus', m.id); added++; }
  if (!S.settings.seeded) saveSettings({ seeded: true });
  S.ver++; render();
  toast(added ? 'ใส่รายการเริ่มต้น ' + added + ' รายการแล้ว' : 'มีรายการเริ่มต้นครบอยู่แล้ว');
}

function updateSync() {
  const el = $('#sync'); if (!el) return;

function diffText(row, ing) {

function lowList() {

    .filter(x => x.lv != null && n0(x.i.min) > 0 && x.lv < x.i.min)
    .sort((a, b) => a.lv / a.i.min - b.lv / b.i.min);
}
function lastCountDate() {
  const L = getLedger(); let best = null;
  for (const id in L) for (const d of L[id].dates) if (L[id].by[d].actual != null && (!best || d > best)) best = d;
  return best;
}

function reportData() {
  const today = todayKey(), L = getLedger();
  const start = S.range === 'all' ? '0000-00-00' : addDays(today, -(Number(S.range) - 1));
  const dates = Object.keys(S.days).filter(d => d >= start && d <= today).sort();
  const agg = {}, daily = [];
  let used = 0, waste = 0, test = 0, diff = 0;
  for (const d of dates) {
    let dv = 0, cnt = 0;
    for (const id in S.ingredients) {
      const r = L[id]?.by[d]; if (!r) continue;
      const c = n0(S.ingredients[id].cost);
      const a = agg[id] || (agg[id] = { rec: 0, pos: 0, waste: 0, test: 0, diff: 0, diffV: 0, n: 0 });
      a.rec += r.rec; a.pos += r.pos; a.waste += r.waste; a.test += r.test;
      used += r.pos * c; waste += r.waste * c; test += r.test * c;
      if (r.diff != null) { a.diff += r.diff; a.diffV += r.diff * c; a.n++; diff += r.diff * c; dv += r.diff * c; cnt++; }
    }
    daily.push({ d, v: dv, cnt, total: ingList().length });
  }
  return { dates, agg, daily, used, waste, test, diff };
}
function chartSVG(series) {
  const W = 360, H = 176, ml = 46, mr = 8, mt = 12, mb = 24, pw = W - ml - mr, ph = H - mt - mb;
  let lo = Math.min(0, ...series.map(s => s.v)), hi = Math.max(0, ...series.map(s => s.v));
  if (hi === lo) { hi = 10; lo = -10; }
  const pad = (hi - lo) * 0.08; if (hi > 0) hi += pad; if (lo < 0) lo -= pad;
  const y = v => mt + (hi - v) / (hi - lo) * ph, n = series.length, slot = pw / n, bw = Math.max(4, Math.min(28, slot * 0.62));
  let bars = '';
  series.forEach((s, k) => {
    const cx = ml + slot * k + slot / 2, y0 = y(0), y1 = y(s.v), top = Math.min(y0, y1), h = Math.max(Math.abs(y1 - y0), 3);
    const col = s.v < 0 ? 'var(--bad)' : s.v > 0 ? 'var(--warn)' : 'var(--good)';
    bars += `<rect x="${(cx - bw / 2).toFixed(1)}" y="${(s.v === 0 ? y0 - 1.5 : top).toFixed(1)}" width="${bw.toFixed(1)}" height="${(s.v === 0 ? 3 : h).toFixed(1)}" rx="2" style="fill:${col}"><title>${esc(dShort(s.d))}: ${moneySgn(s.v)}</title></rect>`;
  });
  const ticks = [hi - (hi > 0 ? pad : 0), 0, lo + (lo < 0 ? pad : 0)];
  const grid = ticks.map((t, k) => `<line x1="${ml}" x2="${W - mr}" y1="${y(t).toFixed(1)}" y2="${y(t).toFixed(1)}" style="stroke:var(--line);fill:none" stroke-width="${t === 0 ? 1.5 : 1}" ${t === 0 ? '' : 'stroke-dasharray="3 3"'}/><text x="${ml - 6}" y="${(y(t) + 3).toFixed(1)}" text-anchor="end">${money(t)}</text>`).join('');
  const idx = n >= 5 ? [0, Math.floor((n - 1) / 2), n - 1] : n > 1 ? [0, n - 1] : [0];
  const xl = idx.map(k => `<text x="${(ml + slot * k + slot / 2).toFixed(1)}" y="${H - 6}" text-anchor="${k === 0 && n > 1 ? 'start' : k === n - 1 && n > 1 ? 'end' : 'middle'}">${dDay(series[k].d)}</text>`).join('');
  return `<svg viewBox="0 0 ${W} ${H}" role="img" aria-label="ส่วนต่างมูลค่ารายวัน">${grid}${bars}${xl}</svg>`;
}

    </tbody></table></div><p class="cap">หน่วยตามที่ตั้งไว้ของแต่ละวัตถุดิบ (ชิ้น กก. หรือกรัม)</p>

let renderedTab = null, raf = 0, deferred = false;
function render() {
  deferred = false;
  const v = $('#view');
  updateTabs(); updateSync();
  if (!S.ready) { v.innerHTML = `<div class="skel" style="height:212px"></div><div class="skel" style="height:72px"></div><div class="skel" style="height:140px"></div>`; return; }
  const y = window.scrollY, same = renderedTab === S.tab;
  const views = { home: viewHome, count: viewCount, ing: viewIngredients, rep: viewReports };
  v.innerHTML = views[S.tab]();
  renderedTab = S.tab;
  window.scrollTo(0, same ? y : 0);
}
function scheduleRender() {
  if (raf) return;
  raf = requestAnimationFrame(() => { raf = 0; if (typing()) { deferred = true; return; } render(); });
}
function typing() { const a = document.activeElement; return !!(a && a.matches && a.matches('.st-in, #q') && $('#view').contains(a)); }
function updateTabs() {

function updateCard(id, withInputs) {
  const card = $(`[data-card="${CSS.escape(id)}"]`), ing = S.ingredients[id]; if (!card || !ing) return;
  const row = rowFor(id, S.date), u = uLabel(ing);
  const head = $('[data-out="head"]', card);
  if (head) head.innerHTML = cardHead(ing, row, true).match(/<span class="r"[^>]*>([\s\S]*)<\/span><\/button>$/)[1];
  const set = (sel, html) => { const el = $(sel, card); if (el) el.innerHTML = html; };
  set('[data-out="expected"]', `${fmt(row.expected)} ${u}`);
  set('[data-out="formula"]', formulaText(row));
  const m = $('[data-out="match"]', card); if (m) m.innerHTML = `${ICON.check} ตรงตามคาด (${fmt(row.expected)} ${u})`;
  const dbx = $('[data-out="diff"]', card); if (dbx) dbx.outerHTML = diffBox(row, ing);
  const act = $(`#in-${CSS.escape(id)}-actual`, card); if (act) act.placeholder = fmt(row.expected);
  if (withInputs) {
    for (const k of ['begin', 'rec', 'waste', 'test', 'pos', 'actual']) {
      const el = $(`#in-${CSS.escape(id)}-${k}`, card);
      if (el && el !== document.activeElement) el.value = row[k] == null ? '' : numStr(row[k]);
    }
  }
  // begin / pos side labels
  const body = $('[data-body]', card);

function closeSheet(silent) {
  $('#sheetRoot').innerHTML = ''; document.body.style.overflow = '';

const shHead = t => `<div class="sh-head"><h2>${t}</h2><button class="icon-btn" data-act="close-sheet" aria-label="ปิด" style="border:1.5px solid var(--line)">${ICON.close}</button></div>`;
function armConfirm(btn, label, fn) {
  const orig = btn.innerHTML; let armed = false;
  btn.addEventListener('click', e => {
    e.stopPropagation();
    if (!armed) { armed = true; btn.innerHTML = label; btn.classList.add('danger'); setTimeout(() => { armed = false; btn.innerHTML = orig; }, 3500); }
    else fn();
  });

async function fileToDataURL(file, max = 480) {
  const url = URL.createObjectURL(file);
  try {
    const img = await new Promise((res, rej) => { const i = new Image(); i.onload = () => res(i); i.onerror = rej; i.src = url; });
    const s = Math.min(1, max / Math.max(img.width, img.height));
    const c = document.createElement('canvas'); c.width = Math.round(img.width * s); c.height = Math.round(img.height * s);
    c.getContext('2d').drawImage(img, 0, 0, c.width, c.height);
    let out = c.toDataURL('image/jpeg', 0.72);
    if (out.length > 120000) out = c.toDataURL('image/jpeg', 0.5);
    return out;
  } finally { URL.revokeObjectURL(url); }
}

function csvCell(v) { const s = String(v ?? ''); return /[",\n]/.test(s) ? '"' + s.replace(/"/g, '""') + '"' : s; }
function buildCSV() {
  const L = getLedger(), head = ['วันที่', 'รหัส', 'วัตถุดิบ', 'หน่วย', 'ยอดยกมา', 'รับเข้า', 'ของเสีย', 'ทดสอบ', 'POS ตัดขาย', 'คาดว่าเหลือ', 'นับจริง', 'ส่วนต่าง', 'ต้นทุนต่อหน่วย', 'มูลค่าส่วนต่าง'];
  const out = [head.join(',')];
  for (const d of Object.keys(S.days).sort()) for (const i of Object.values(S.ingredients).sort((a, b) => String(a.id).localeCompare(b.id))) {
    const r = L[i.id]?.by[d]; if (!r) continue;
    out.push([d, i.id, dispName(i), uLabel(i), r.begin, r.rec, r.waste, r.test, r.pos, r.expected, r.actual ?? '', r.diff ?? '', n0(i.cost), r.diff == null ? '' : r3(r.diff * n0(i.cost))].map(csvCell).join(','));
  }
  return '﻿' + out.join('\n');
}
async function saveFile(filename, data, label) {

      const a = document.createElement('a'); a.href = url; a.download = filename; document.body.appendChild(a); a.click(); a.remove();

    catch (e) { if (e && e.code === 'declined') return; if (e && e.code !== 'unavailable') { toast('บันทึกไฟล์ไม่สำเร็จ'); } }

    let j; try { j = JSON.parse(String(rd.result).replace(/^\uFEFF/, '')); } catch { toast('ไฟล์นี้อ่านไม่ได้ ต้องเป็นไฟล์สำรองข้อมูล .json จาก Stock Burger'); return; }
    const okObj = v => v && typeof v === 'object' && !Array.isArray(v);
    if (!okObj(j) || !okObj(j.ingredients) || Object.values(j.ingredients).some(i => !okObj(i) || !i.id)) { toast('นี่ไม่ใช่ไฟล์สำรองของ Stock Burger'); return; }
    const nI = Object.keys(j.ingredients).length, nM = Object.keys(okObj(j.menus) ? j.menus : {}).length, nD = Object.keys(okObj(j.days) ? j.days : {}).length;
    openSheet(`${shHead('นำเข้าข้อมูลสำรอง')}
      <p style="margin:0">ไฟล์นี้มีวัตถุดิบ <b>${nI}</b> รายการ เมนู <b>${nM}</b> รายการ และบันทึกสต็อก <b>${nD}</b> วัน</p>
      <p class="cap" style="margin:0">ข้อมูลที่อยู่ในเครื่องนี้ตอนนี้จะถูกแทนที่ด้วยข้อมูลจากไฟล์ ถ้ายังไม่ได้สำรองของเดิมไว้ ให้กดยกเลิกแล้วสำรองก่อน</p>
      <div class="actions"><button class="btn ghost" data-act="close-sheet">ยกเลิก</button><button class="btn" id="i-ok">แทนที่ข้อมูล</button></div>`,
      sh => $('#i-ok', sh).addEventListener('click', () => {
        S.ingredients = j.ingredients; S.menus = okObj(j.menus) ? j.menus : {}; S.days = okObj(j.days) ? j.days : {};
        S.settings = { tolerancePct: 3, ...(okObj(j.settings) ? j.settings : {}) };
        S.ver++; lsSave(); closeSheet(true); render(); toast('นำเข้าข้อมูลแล้ว');
      }));
  };
  rd.readAsText(file);
}
function openSettings() {
  const cloud = Store.mode === 'cloud';
  openSheet(`${shHead('ตั้งค่า')}
  <div class="banner info" role="note"><div>${cloud
    ? '<b>ข้อมูลซิงก์ทุกเครื่อง</b><br>เปิดลิงก์เดียวกันด้วยบัญชีที่ได้รับสิทธิ์แล้วเห็นตัวเลขชุดเดียวกัน'
    : PWA ? '<b>ข้อมูลเก็บในเครื่องนี้</b><br>มือถือกับคอมพิวเตอร์ไม่ซิงก์กันเอง ถ้าจะย้ายข้อมูลข้ามเครื่อง ให้กด “สำรองข้อมูล” จากเครื่องหนึ่ง แล้ว “นำเข้าข้อมูลสำรอง” ในอีกเครื่อง'
    : '<b>ข้อมูลเก็บในเบราว์เซอร์เครื่องนี้</b><br>ถ้าเปิดผ่านลิงก์ที่ลงชื่อเข้าใช้ Claude ข้อมูลจะซิงก์กับเครื่องอื่นให้'}</div></div>
  ${PWA && !isStandalone() ? `<div class="banner info" role="note"><div><b>ติดตั้งเป็นแอป</b><div style="margin-top:8px">${installHelp()}</div></div></div>` : ''}
  <div><label class="lbl" for="t-tol">ส่วนต่างที่ยอมรับได้ (% ของยอดยกมา + รับเข้า)</label>
    <div class="two"><input class="inp" id="t-tol" inputmode="decimal" value="${numStr(n0(S.settings.tolerancePct))}"><button class="btn sm" id="t-save" type="button">บันทึก</button></div>
    <p class="cap" style="margin-top:6px">ส่วนต่างที่ไม่เกินค่านี้แสดงสีเหลือง เกินแล้วแสดงสีแดง</p></div>
  <button class="btn ghost block" id="t-csv">${ICON.down} ส่งออกประวัติทั้งหมดเป็น CSV</button>
  <button class="btn ghost block" id="t-json">${ICON.down} สำรองข้อมูลเป็น JSON</button>
  ${Store.mode === 'local' ? `<button class="btn ghost block" id="t-import" type="button">${ICON.down} นำเข้าข้อมูลสำรอง (JSON)</button><input type="file" id="t-file" accept="application/json,.json" hidden>` : ''}
  <button class="btn ghost block" id="t-seed">ใส่วัตถุดิบและสูตรเริ่มต้นที่ยังไม่มี</button>
  <p class="cap">วัตถุดิบเริ่มต้น 10 รายการนำมาจากแอปเดิม ส่วนชื่อไทย ต้นทุน ระดับขั้นต่ำ และสูตรเมนูเป็นค่าประมาณที่แก้ได้ทั้งหมด</p>`, sh => {
    $('#t-save', sh).addEventListener('click', () => { const v = parseNum($('#t-tol', sh).value); if (v == null || v < 0) { toast('ใส่ตัวเลข 0 ขึ้นไป'); return; } saveSettings({ tolerancePct: v }); render(); toast('บันทึกแล้ว'); });
    $('#t-csv', sh).addEventListener('click', () => saveFile('stock-burger-' + todayKey() + '.csv', buildCSV(), 'ส่งออก CSV'));
    $('#t-json', sh).addEventListener('click', () => saveFile('stock-burger-backup-' + todayKey() + '.json', JSON.stringify({ ingredients: S.ingredients, menus: S.menus, days: S.days, settings: S.settings }, null, 1), 'สำรองข้อมูล'));
    $('#t-seed', sh).addEventListener('click', () => { closeSheet(true); seedDefaults(); });
    const imp = $('#t-import', sh), fin = $('#t-file', sh);
    if (imp && fin) { imp.addEventListener('click', () => fin.click()); fin.addEventListener('change', () => { const f = fin.files && fin.files[0]; if (f) importBackup(f); }); }
  });
}

/* ---------- events ---------- */
document.addEventListener('click', e => {
  const el = e.target.closest('[data-act]'); if (!el) return;
  const a = el.dataset.act, id = el.dataset.id;
  switch (a) {
    case 'tab': S.tab = el.dataset.tab; if (S.tab !== 'ing') S.q = ''; if (S.tab === 'ing') S.filter = 'all'; render(); break;
    case 'subtab': S.sub = el.dataset.v; render(); break;
    case 'close-sheet': closeSheet(); break;
    case 'toggle': S.openId = S.openId === id ? null : id; render(); if (S.openId) { const c = $(`[data-card="${CSS.escape(id)}"]`); if (c) c.scrollIntoView({ block: 'start', behavior: 'smooth' }); } break;
    case 'filter': S.filter = el.dataset.v; render(); break;
    case 'range': S.range = el.dataset.v; render(); break;
    case 'date': { const nd = addDays(S.date, Number(el.dataset.d)); if (nd <= todayKey()) { S.date = nd; S.openId = null; render(); } break; }
    case 'goto': S.date = el.dataset.d; S.tab = 'count'; S.openId = null; render(); break;
    case 'step': {
      const ing = S.ingredients[id]; if (!ing) break;
      const k = el.dataset.k, dir = Number(el.dataset.dir), row = rowFor(id, S.date);
      const base = k === 'actual' ? (row.actual ?? row.expected) : row[k];
      const nv = Math.max(0, r3(base + dir * stepOf(ing)));
      if (setField(id, k, nv)) updateCard(id, true);
      break;
    }
    case 'match': { const row = rowFor(id, S.date); if (setField(id, 'actual', row.expected)) updateCard(id, true); break; }
    case 'reset-begin': if (patchEntry(S.date, id, { begin: null })) updateCard(id, true); break;
    case 'reset-pos': {
      const day = S.days[S.date], use = usageFromSales(day?.sales || {});
      if (patchEntry(S.date, id, { pos: r3(use[id] || 0), posSrc: 'auto' })) updateCard(id, true);
      break;
    }
    case 'sales': openSalesSheet(); break;
    case 'order': openOrderSheet(); break;
    case 'open-ing': openIngSheet(id); break;
    case 'new-ing': openIngSheet(null); break;
    case 'open-menu': openMenuSheet(id); break;
    case 'new-menu': openMenuSheet(null); break;
    case 'settings': openSettings(); break;
    case 'export': saveFile('stock-burger-' + todayKey() + '.csv', buildCSV(), 'ส่งออก CSV'); break;
    case 'seed': seedDefaults(); break;
    case 'install': if (inst.ev) { const ev = inst.ev; inst.ev = null; try { ev.prompt(); ev.userChoice.then(r => { if (r && r.outcome === 'accepted') toast('กำลังติดตั้งแอป'); }).catch(() => { }); } catch { } closeSheet(true); render(); } break;
    case 'hide-install': try { localStorage.setItem('sb.hideInstall', '1'); } catch { } render(); break;
    case 'hide-est': hasMsg.est = true; try { localStorage.setItem('sb.hideEst', '1'); } catch { } render(); break;
  }
});
document.addEventListener('input', e => {
  const t = e.target;
  if (t.matches('.st-in')) {
    const id = t.dataset.id, k = t.dataset.k, v = parseNum(t.value);
    if (!S.ingredients[id]) return;
    if (t.value.trim() === '' ) { if (k === 'actual') { if (setField(id, k, null)) updateCard(id, false); } else if (k === 'begin') { /* wait for a number */ } else { if (setField(id, k, 0)) updateCard(id, false); } return; }
    if (v == null) return;
    if (setField(id, k, Math.max(0, v))) updateCard(id, false); else updateCard(id, true);
  } else if (t.id === 'q') {
    S.q = t.value; const g = $('#ingGrid'); if (g) g.innerHTML = ingCardsHTML();
  }
});
document.addEventListener('change', e => {
  const t = e.target;
  if (t.id === 'dayPick') { if (t.value && t.value <= todayKey()) { S.date = t.value; S.openId = null; render(); } }
  else if (t.matches('.st-in')) updateCard(t.dataset.id, true);
});
document.addEventListener('focusout', () => { if (deferred) setTimeout(() => { if (deferred && !typing()) render(); }, 60); });
document.addEventListener('keydown', e => { if (e.key === 'Escape' && $('.sheet')) closeSheet(); });

/* ---------- boot ---------- */
function buildChrome() {
  $('#logo').src = IMG.logo;
  $('#gear').innerHTML = ICON.gear;
  const tabs = [['home', 'หน้าหลัก', ICON.home], ['count', 'นับสต็อก', ICON.count], ['ing', 'วัตถุดิบ', ICON.box], ['rep', 'รายงาน', ICON.chart]];
  $('#tabs').innerHTML = tabs.map(([k, l, ic]) => `<button class="tab" data-act="tab" data-tab="${k}">${ic}<span>${l}</span>${k === 'home' ? '<span class="dot" id="tab-badge" hidden></span>' : ''}</button>`).join('');
}
function startLocal() {
  Store.mode = 'local';
  const saved = lsLoad();
  if (saved && saved.ingredients) { S.ingredients = saved.ingredients; S.menus = saved.menus || {}; S.days = saved.days || {}; S.settings = { tolerancePct: 3, ...(saved.settings || {}) }; }
  else {
    for (const i of DEFAULTS.ingredients) S.ingredients[i.id] = clone(i);
    for (const m of DEFAULTS.menus) S.menus[m.id] = clone(m);
    S.settings = { ...S.settings, ...clone(DEFAULTS.settings) };
    lsSave();
  }
  S.ver++; S.ready = true; render();
}
function startCloud(db, canWrite) {
  Store.mode = 'cloud'; Store.db = db; Store.canWrite = canWrite !== false;
  const got = {};
  const done = k => { got[k] = true; if (got.ingredients && got.menus && got.days && got.settings && !S.ready) { S.ready = true; } };
  const onColl = coll => snap => {
    const m = {}; snap.docs.forEach(d => { m[d.id] = d.data(); });
    for (const [key, w] of wq) if (key.startsWith(coll + '/') && (w.timer || w.busy)) { const id = key.slice(coll.length + 1); if (S[coll][id]) m[id] = S[coll][id]; else delete m[id]; }
    S[coll] = m; S.ver++; done(coll); scheduleRender();
  };
  const bad = e => { if (!S.ready) { S.ready = true; } if (e && e.code === 'revoked') { Store.canWrite = false; } updateSync(); scheduleRender(); };
  for (const c of ['ingredients', 'menus', 'days']) db.collection(c).onSnapshot(onColl(c), bad);
  db.doc('settings/main').onSnapshot(snap => {
    if (!isPending('settings/main')) S.settings = { tolerancePct: 3, ...(snap.exists ? snap.data() : {}) };
    S.ver++; done('settings'); scheduleRender();
  }, bad);
  setTimeout(() => { if (!S.ready) { S.ready = true; scheduleRender(); } }, 8000);
}
function startPWA() {
  window.addEventListener('beforeinstallprompt', e => { e.preventDefault(); inst.ev = e; render(); });
  window.addEventListener('appinstalled', () => { inst.ev = null; toast('ติดตั้งแอปแล้ว'); render(); });
  try { if (navigator.storage && navigator.storage.persist) navigator.storage.persist(); } catch { }
  try { if ('serviceWorker' in navigator && /^https?:$/.test(location.protocol)) navigator.serviceWorker.register('sw.js').catch(() => { }); } catch { }
}
async function boot() {
  if (PWA) startPWA();
  buildChrome(); render();
  let db = null, dl = null, usr = null;
  try {
    if (window.claude && typeof window.claude.use === 'function') {
      [db, dl, usr] = await Promise.all(['db', 'downloads', 'user'].map(n => window.claude.use(n).catch(() => null)));
    }
  } catch { }
  Store.dl = dl;
  if (db) {
    let can = null; try { can = usr ? await usr.can('data.write') : null; } catch { }
    startCloud(db, can);
  } else startLocal();
  updateSync();
}
boot();

</script>
</body></html>
