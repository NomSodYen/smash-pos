<!doctype html><html lang="th"><head><meta charset="utf-8"><meta name=viewport content="width=device-width,initial-scale=1,viewport-fit=cover"><style>:root{color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}html{scroll-padding-top:env(safe-area-inset-top,0px)}body{margin:0;padding:0;font:14px -apple-system,BlinkMacSystemFont,sans-serif;background:#fff;color:#000}img{max-width:100%}[hidden]:not([hidden=until-found i]){display:none!important}</style></head><body>
<title>POS สแมชเบอร์เกอร์</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bai+Jamjuree:wght@500;600;700&family=IBM+Plex+Sans+Thai:wght@400;500;600&display=swap">
<script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
<style>
/* Layout: ที่ขายอยู่ซ้าย (ปุ่มทานที่ร้าน/กลับบ้านอยู่บนสุด) ออเดอร์ติดขวา; บนมือถือออเดอร์เป็นแผ่นเลื่อนขึ้นจากแถบล่าง */
:root{
  --bg:#eceeeb; --surface:#ffffff; --ink:#1a201d; --muted:#5b665f; --line:#d7dcd8;
  --accent:#c93522; --on-accent:#ffffff; --promo:#f1b90c; --on-promo:#2a2000;
  --good:#1c7a4a; --bad:#b3261e; --beef:#6a2e1b; --pork:#c9856a; --bun:#e0a24a;
  --f-display:"Bai Jamjuree","Noto Sans Thai",system-ui,sans-serif;
  --f-body:"IBM Plex Sans Thai","Noto Sans Thai",system-ui,sans-serif;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#111513; --surface:#1a201d; --ink:#edf1ee; --muted:#98a39d; --line:#2b3430;
    --accent:#ee5a44; --on-accent:#1a0603; --promo:#f2c230; --on-promo:#2a2000;
    --good:#4cc38a; --bad:#ff8a80; --beef:#c4694a; --pork:#e0a58c; --bun:#d99a3f;
    color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --bg:#111513; --surface:#1a201d; --ink:#edf1ee; --muted:#98a39d; --line:#2b3430;
  --accent:#ee5a44; --on-accent:#1a0603; --promo:#f2c230; --on-promo:#2a2000;
  --good:#4cc38a; --bad:#ff8a80; --beef:#c4694a; --pork:#e0a58c; --bun:#d99a3f;
  color-scheme:dark;
}
*{box-sizing:border-box}
body{background:var(--bg);color:var(--ink);font-family:var(--f-body);font-size:15px;line-height:1.5;padding-inline:16px;padding-block:0 96px}
button{font:inherit;color:inherit;cursor:pointer}
button:focus-visible,input:focus-visible,summary:focus-visible{outline:3px solid var(--accent);outline-offset:2px}
.num{font-family:var(--f-display);font-variant-numeric:tabular-nums}
.wrap{max-width:1120px;margin-inline:auto}

/* header */
.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:var(--bg);display:flex;flex-wrap:wrap;align-items:center;justify-content:space-between;gap:8px 16px;padding-block:12px;border-bottom:1px solid var(--line)}
.brand{display:flex;flex-direction:column;min-width:0}
.brand b{font-family:var(--f-display);font-size:20px;font-weight:700;line-height:1.1}
.brand span{font-size:13px;color:var(--muted)}
.tabs{display:flex;gap:4px;background:var(--line);padding:3px;border-radius:12px}
.tab{border:0;background:transparent;padding:8px 16px;min-height:40px;border-radius:9px;font-weight:600;color:var(--muted)}
.tab[aria-selected="true"]{background:var(--surface);color:var(--ink)}
.tab i{font-style:normal;font-family:var(--f-display);font-size:12px;background:var(--accent);color:var(--on-accent);border-radius:99px;padding:1px 7px;margin-left:6px}

/* sell */
.sell{display:grid;grid-template-columns:minmax(0,1fr) 380px;gap:24px;align-items:start;padding-top:16px}
.mode{display:grid;grid-template-columns:1fr 1fr;gap:8px;max-width:520px}
.mbtn{display:flex;align-items:center;gap:12px;min-height:56px;padding:8px 16px;border:2px solid var(--line);border-radius:12px;background:var(--surface);font-weight:600;font-size:16px;text-align:left}
.mbtn[aria-pressed="true"]{border-color:var(--accent)}
.tick{flex:none;width:24px;height:24px;border:2px solid var(--muted);border-radius:6px;display:grid;place-items:center}
.mbtn[aria-pressed="true"] .tick{background:var(--accent);border-color:var(--accent)}
.mbtn[aria-pressed="true"] .tick::after{content:"";width:6px;height:11px;border:solid var(--on-accent);border-width:0 3px 3px 0;transform:translateY(-1px) rotate(45deg)}
h2.sec{font-family:var(--f-display);font-size:13px;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);font-weight:600;margin:24px 0 8px}
.menu{display:grid;grid-template-columns:repeat(auto-fill,minmax(250px,1fr));gap:12px}
.card{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:16px;display:flex;flex-direction:column;gap:12px;min-width:0}
.card-h{display:flex;gap:14px;align-items:center}
.ico{flex:none;width:64px;height:54px}
.card h3{margin:0;font-size:17px;font-weight:600;line-height:1.25;text-wrap:balance}
.price{font-family:var(--f-display);font-weight:700;font-size:30px;line-height:1;font-variant-numeric:tabular-nums}
.price small{font-size:15px;font-weight:600;color:var(--muted);margin-left:4px}
.card-f{display:grid;grid-template-columns:1fr;gap:8px}
.btn{min-height:48px;padding:8px 14px;border-radius:10px;border:2px solid var(--line);background:var(--surface);font-weight:600}
.btn.pri{background:var(--accent);border-color:var(--accent);color:var(--on-accent)}
.btn.pri:disabled{background:var(--line);border-color:var(--line);color:var(--muted);cursor:not-allowed}
.btn.wide{width:100%;min-height:54px;font-size:17px;font-family:var(--f-display);font-weight:700}
.hint{color:var(--muted);font-size:14px;margin:0}

/* order panel */
.order{background:var(--surface);border:1px solid var(--line);border-radius:16px;position:sticky;top:calc(env(safe-area-inset-top,0px) + 76px);display:flex;flex-direction:column;max-height:calc(100dvh - 100px)}
.o-head{display:flex;align-items:center;justify-content:space-between;gap:8px;padding:14px 16px;border-bottom:1px solid var(--line)}
.o-head b{font-family:var(--f-display);font-size:18px}
.badge{display:inline-block;font-size:12px;font-weight:600;padding:2px 10px;border-radius:99px;background:var(--line)}
.badge.take{background:var(--accent);color:var(--on-accent)}
.o-close{display:none}
.cust{padding:10px 16px 0}
.cin{width:100%;min-height:44px;padding:6px 12px;border:2px solid var(--line);border-radius:10px;background:var(--bg);color:var(--ink);font:inherit}
.who{text-align:center;font-weight:600;font-size:18px;margin-top:4px}
.cn{color:var(--ink);font-weight:600}
.lines{list-style:none;margin:0;padding:0 16px;overflow-y:auto;flex:1;min-height:80px}
.line{display:flex;justify-content:space-between;gap:12px;padding:12px 0;border-bottom:1px dashed var(--line)}
.line:last-child{border-bottom:0}
.l-main{min-width:0}
.l-name{font-weight:600}
.l-add{font-size:13px;color:var(--muted);display:flex;flex-wrap:wrap;gap:4px 6px;align-items:center}
.tag{font-size:11px;font-weight:700;background:var(--promo);color:var(--on-promo);padding:0 7px;border-radius:4px;line-height:18px}
.l-side{display:flex;flex-direction:column;align-items:flex-end;gap:6px;flex:none}
.l-total{font-family:var(--f-display);font-weight:700;font-variant-numeric:tabular-nums}
.stepper{display:inline-flex;align-items:center;border:2px solid var(--line);border-radius:10px;overflow:hidden}
.stepper button{width:40px;height:38px;border:0;background:transparent;font-size:20px;line-height:1}
.stepper span{min-width:30px;text-align:center;font-family:var(--f-display);font-weight:700;font-variant-numeric:tabular-nums}
.empty{padding:28px 8px;text-align:center;color:var(--muted)}
.o-foot{padding:14px 16px 16px;border-top:1px solid var(--line);display:flex;flex-direction:column;gap:10px}
.sum{display:flex;justify-content:space-between;align-items:baseline}
.sum b{font-family:var(--f-display);font-size:32px;font-variant-numeric:tabular-nums}
.bar{display:none}
.scrim{display:none}

/* sheets */
.ov{position:fixed;inset:0;z-index:20;background:rgba(10,14,12,.55);display:flex;align-items:flex-end;justify-content:center}
.ov[hidden]{display:none}
.sheet{background:var(--surface);width:100%;max-width:520px;max-height:92dvh;overflow-y:auto;border-radius:18px 18px 0 0;padding:18px 16px calc(18px + env(safe-area-inset-bottom,0px))}
@media(min-width:640px){.ov{align-items:center}.sheet{border-radius:18px}}
.s-head{display:flex;justify-content:space-between;align-items:flex-start;gap:12px;margin-bottom:8px}
.s-head h3{margin:0;font-family:var(--f-display);font-size:20px;line-height:1.25}
.x{flex:none;width:40px;height:40px;border-radius:10px;border:0;background:var(--line);font-size:20px;line-height:1}
.grp{font-family:var(--f-display);font-size:13px;letter-spacing:.06em;text-transform:uppercase;color:var(--muted);font-weight:600;margin:16px 0 4px;display:flex;align-items:center;gap:8px}
.opt{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:8px 0;border-bottom:1px solid var(--line)}
.opt:last-of-type{border-bottom:0}
.opt-n{min-width:0}
.opt-n b{font-weight:600}
.opt-n small{display:block;color:var(--muted);font-size:13px}
.opt .stepper button{width:44px;height:42px}
.qrow{display:flex;justify-content:space-between;align-items:center;margin-top:16px;padding-top:12px;border-top:2px solid var(--line)}
.seg{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-block:12px}
.seg .btn[aria-pressed="true"]{border-color:var(--accent)}
.qk{display:flex;flex-wrap:wrap;gap:8px;margin-block:10px}
.qk .btn{min-height:44px;padding-inline:14px}
.field{width:100%;min-height:56px;font-family:var(--f-display);font-weight:700;font-size:26px;padding:6px 14px;border-radius:12px;border:2px solid var(--line);background:var(--bg);color:var(--ink);font-variant-numeric:tabular-nums}
.vegs{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-block:6px}
.vegs .mbtn{min-height:52px;font-size:15px;padding:8px 12px}
.pad{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-block:10px}
.pad .btn{min-height:56px;font-family:var(--f-display);font-size:22px;font-weight:700}
.chg{min-height:36px;margin-block:10px;font-family:var(--f-display);font-weight:700;font-size:22px}
.chg.ok{color:var(--good)}
.chg.short{color:var(--bad)}
.queue{text-align:center;padding:8px 0 4px}
.queue small{display:block;color:var(--muted);font-weight:600}
.queue b{font-family:var(--f-display);font-size:72px;line-height:1.05;font-weight:700}
.rcpt{list-style:none;margin:12px 0;padding:12px 0;border-block:1px dashed var(--line)}
.rcpt li{display:flex;justify-content:space-between;gap:12px;padding:3px 0}
.kv{display:flex;justify-content:space-between;padding:2px 0}
.kv.big{font-family:var(--f-display);font-weight:700;font-size:20px}

/* summary */
.report{padding-top:16px;max-width:760px}
.rev{background:var(--surface);border:1px solid var(--line);border-radius:16px;padding:18px 20px}
.rev small{color:var(--muted);font-weight:600}
.rev .big{font-family:var(--f-display);font-weight:700;font-size:48px;line-height:1.1;font-variant-numeric:tabular-nums}
.facts{display:flex;flex-wrap:wrap;gap:6px 24px;margin-top:6px;color:var(--muted)}
.facts b{color:var(--ink);font-family:var(--f-display);font-variant-numeric:tabular-nums}
table{width:100%;border-collapse:collapse}
.tw{overflow-x:auto;background:var(--surface);border:1px solid var(--line);border-radius:14px}
th,td{text-align:left;padding:10px 14px;border-bottom:1px solid var(--line);white-space:nowrap}
th{font-size:12px;letter-spacing:.06em;text-transform:uppercase;color:var(--muted);font-weight:600}
tr:last-child td{border-bottom:0}
td.r,th.r{text-align:right;font-family:var(--f-display);font-variant-numeric:tabular-nums}
.bills{display:flex;flex-direction:column;gap:8px}
details{background:var(--surface);border:1px solid var(--line);border-radius:12px}
summary{list-style:none;display:flex;align-items:center;gap:10px;padding:12px 14px;cursor:pointer;min-height:52px}
summary::-webkit-details-marker{display:none}
summary .no{font-family:var(--f-display);font-weight:700;font-size:18px;min-width:44px}
summary .meta{flex:1;min-width:0;color:var(--muted);font-size:14px}
summary .amt{font-family:var(--f-display);font-weight:700;font-variant-numeric:tabular-nums}
.bd{padding:0 14px 14px}
.del{margin-top:10px;min-height:44px;border:2px solid var(--line);border-radius:10px;background:transparent;padding:6px 14px;font-weight:600}
.del.arm{border-color:var(--bad);color:var(--bad)}

.toast{position:fixed;left:50%;bottom:calc(88px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:var(--ink);color:var(--bg);padding:10px 18px;border-radius:99px;font-weight:600;z-index:30;white-space:normal;text-align:center;width:max-content;max-width:calc(100vw - 32px);border-radius:16px}
.toast[hidden]{display:none}

@media(max-width:859px){
  .sell{grid-template-columns:minmax(0,1fr)}
  .order{position:fixed;left:0;right:0;bottom:0;top:auto;z-index:15;border-radius:18px 18px 0 0;max-height:82dvh;transform:translateY(105%);transition:transform .22s ease;padding-bottom:env(safe-area-inset-bottom,0px)}
  .order.open{transform:none}
  .o-close{display:block}
  .scrim.open{display:block;position:fixed;inset:0;z-index:14;background:rgba(10,14,12,.45)}
  .bar{display:flex;position:fixed;left:0;right:0;bottom:0;z-index:10;background:var(--surface);border-top:1px solid var(--line);padding:10px 16px calc(10px + env(safe-area-inset-bottom,0px));gap:12px;align-items:center}
  .bar-i{flex:1;min-width:0}
  .bar-i small{display:block;color:var(--muted);font-size:13px}
  .bar-i b{font-family:var(--f-display);font-size:24px;font-variant-numeric:tabular-nums}
  .bar .btn{min-width:150px}
}
@media(prefers-reduced-motion:reduce){.order{transition:none}}
.sumbar{display:flex;justify-content:flex-end;margin-bottom:12px}
.sumbar .btn{min-height:48px}
.ponly{display:none}
@media print{
  :root:root:root{--bg:#fff;--surface:#fff;--ink:#000;--muted:#444;--line:#bbb;color-scheme:light}
  body{padding:0;background:#fff;font-size:13px}
  .top,.bar,.scrim,.toast,.ov,.order,#v-sell,.sumbar,.del{display:none!important}
  .wrap{max-width:none}
  .report{padding-top:0;max-width:none}
  .ponly{display:block;margin:0 0 10px}
  .rev,.tw,details{border-color:#999;break-inside:avoid}
  .rev .big{font-size:36px}
}
</style>

<div class="wrap">
  <header class="top">
    <div class="brand"><b>สแมชเบอร์เกอร์</b><span id="today"></span></div>
    <nav class="tabs" role="tablist" aria-label="หน้าหลัก">
      <button class="tab" role="tab" id="t-sell" data-act="tab" data-t="sell" aria-selected="true">ขาย</button>
      <button class="tab" role="tab" id="t-sum" data-act="tab" data-t="sum" aria-selected="false">ยอดวันนี้<i id="t-count" hidden>0</i></button>
    </nav>
  </header>

  <main id="v-sell" class="sell">
    <section aria-label="เมนู">
      <div class="mode" role="group" aria-label="รับอาหารแบบไหน">
        <button class="mbtn" id="m-dine" data-act="mode" data-m="dine" aria-pressed="true"><span class="tick"></span>ทานที่ร้าน</button>
        <button class="mbtn" id="m-take" data-act="mode" data-m="take" aria-pressed="false"><span class="tick"></span>กลับบ้าน</button>
      </div>
      <h2 class="sec">เมนู</h2>
      <div class="menu" id="menu"></div>
      <p class="hint" style="margin-top:12px">แตะ “เพิ่มเลย” เพื่อใส่ออเดอร์ทันที แล้วเลือกผัก ไข่ ชีส เบคอน เพิ่มแพตตี้ (ราคาโปรหรือราคาปกติ) ต่อได้เลย (กด × ถ้าไม่เอาเพิ่ม)</p>
    </section>

    <aside class="order" id="order" aria-label="ออเดอร์ปัจจุบัน">
      <div class="o-head">
        <div><b>ออเดอร์ <span class="num" id="o-no">#1</span></b> <span class="badge" id="o-mode">ทานที่ร้าน</span></div>
        <button class="x o-close" data-act="toggleOrder" aria-label="ปิดออเดอร์">×</button>
      </div>
      <div class="cust"><input id="cust" class="cin" type="text" maxlength="30" placeholder="ชื่อลูกค้า (ไม่ใส่ก็ได้)" autocomplete="off" aria-label="ชื่อลูกค้า"></div>
      <ul class="lines" id="lines"></ul>
      <div class="o-foot">
        <div class="sum"><span>รวมทั้งหมด</span><b id="o-total">฿0</b></div>
        <button class="btn pri wide" id="o-pay" data-act="pay" disabled>ชำระเงิน</button>
        <button class="btn wide" id="o-print" data-act="printCart" disabled>🖨 พิมพ์ใบออเดอร์ให้เชฟ</button>
        <button class="del" id="o-pset" data-act="pset" style="margin-top:0;min-height:36px;font-weight:500;font-size:13px"></button>
        <button class="del" id="o-clear" data-act="clear" hidden style="margin-top:0">ล้างออเดอร์</button>
      </div>
    </aside>
  </main>

  <main id="v-sum" class="report" hidden></main>
</div>

<div class="scrim" id="scrim" data-act="toggleOrder"></div>
<div class="bar" id="bar">
  <div class="bar-i"><small id="bar-s">ยังไม่มีรายการ</small><b id="bar-t">฿0</b></div>
  <button class="btn pri" data-act="toggleOrder">ดูออเดอร์</button>
</div>
<div class="toast" id="toast" role="status" hidden></div>
<div class="ov" id="ov" hidden><div class="sheet" id="sheet" role="dialog" aria-modal="true"></div></div>

<script>
(function(){
  var BURGER={
    beef:{name:'สแมชเบอร์เกอร์เนื้อ',short:'เนื้อ',price:99},
    pork:{name:'สแมชเบอร์เกอร์หมู',short:'หมู',price:89}
  };
  var VEG=['ผักกาดแก้ว','หอมหัวใหญ่','มะเขือเทศ','แตงกวาดอง'];
  var REG_KEYS=['beef','pork'];
  var ADD={
    pBeef:{name:'เพิ่มแพตตี้เนื้อ (โปร)',price:21,patty:true,promo:true},
    pPork:{name:'เพิ่มแพตตี้หมู (โปร)',price:11,patty:true,promo:true},
    beef:{name:'เพิ่มแพตตี้เนื้อ',price:49,patty:true},
    pork:{name:'เพิ่มแพตตี้หมู',price:39,patty:true},
    egg:{name:'เพิ่มไข่',price:10},
    cheese:{name:'เพิ่มชีส',price:10},
    bacon:{name:'เพิ่มเบคอน',price:15}
  };
  var EXTRA_KEYS=['pBeef','pPork','beef','pork','egg','cheese','bacon'];

  function load(k,d){try{var v=localStorage.getItem(k);return v?JSON.parse(v):d}catch(e){return d}}
  function save(k,v){try{localStorage.setItem(k,JSON.stringify(v))}catch(e){}}
  var orders=load('smash.orders',[]);
  var counter=load('smash.counter',{d:'',n:0});
  var cart=[], cust='', mode='dine', tab='sell', draft=null, pay=null, toastT=null;
  function esc(s){return String(s).replace(/[&<>"']/g,function(c){return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]})}

  var $=function(id){return document.getElementById(id)};
  var fmt=function(n){return '฿'+Number(n).toLocaleString('en-US')};
  function dayKey(d){d=d||new Date();return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0')}
  function hhmm(ts){var d=new Date(ts);return String(d.getHours()).padStart(2,'0')+':'+String(d.getMinutes()).padStart(2,'0')}
  function modeLabel(m){return m==='take'?'กลับบ้าน':'ทานที่ร้าน'}
  function peekNo(){return counter.d===dayKey()?counter.n+1:1}

  function addSum(add){var s=0;for(var k in add)s+=ADD[k].price*add[k];return s}

    var s=sig(b,clean,veg);
    for(var i=0;i<cart.length;i++){if(sig(cart[i].b,cart[i].add,cart[i].veg)===s){cart[i].qty+=qty;return}}
    cart.push({b:b,qty:qty,add:clean,veg:veg});
  }

  function buildPdf(){
    var today=dayKey(),os=orders.filter(function(o){return o.day===today}).sort(function(a,b){return a.ts-b.ts});
    var total=os.reduce(function(s,o){return s+o.total},0),n=os.length;
    var byMode={dine:{n:0,t:0},take:{n:0,t:0}},byPay={cash:0,transfer:0},items={},adds={};
    os.forEach(function(o){
      byMode[o.mode].n++;byMode[o.mode].t+=o.total;byPay[o.method]+=o.total;
      o.lines.forEach(function(l){
        var it=items[l.name]||(items[l.name]={qty:0,amt:0});it.qty+=l.qty;it.amt+=l.price*l.qty;
        l.add.forEach(function(a){
          var key=(a.promo?'[โปร] ':'')+a.name,x=adds[key]||(adds[key]={qty:0,amt:0});
          x.qty+=a.qty*l.qty;x.amt+=a.price*a.qty*l.qty;
        });
      });
    });
    var W=1240,H=1754,M=70,K=1,pages=[],cx,y,INK='#161a18',MUTED='#5b665f',LINE='#c9cfcb',RED='#c93522';
    function k(v){return Math.round(v*K)}
    function newPage(){var c=document.createElement('canvas');c.width=W;c.height=H;cx=c.getContext('2d');cx.fillStyle='#fff';cx.fillRect(0,0,W,H);pages.push(c);y=M}
    function font(w,s,d){cx.font=w+' '+k(s)+'px '+(d?'"Bai Jamjuree"':'"IBM Plex Sans Thai"')+',"Noto Sans Thai",sans-serif'}
    function put(t,x,al,col){cx.textAlign=al||'left';cx.textBaseline='alphabetic';cx.fillStyle=col||INK;cx.fillText(t,x,y)}
    function need(h){if(y+k(h)>H-M-30)newPage()}
    function rule(col,w){cx.strokeStyle=col||LINE;cx.lineWidth=w||2;cx.beginPath();cx.moveTo(M,y);cx.lineTo(W-M,y);cx.stroke()}
    function fit(t,max){if(cx.measureText(t).width<=max)return t;while(t.length>1&&cx.measureText(t+'…').width>max)t=t.slice(0,-1);return t+'…'}
    function row(l,mid,r,o){o=o||{};need(o.h||46);font(o.w||400,o.s||26,o.d);
      var x0=M+(o.ind||0),rightEdge=mid!=null?W-M-250-150:(r!=null?W-M-190:W-M);
      put(fit(l,rightEdge-x0),x0,'left',o.c);
      if(mid!=null)put(mid,W-M-250,'right',o.c);if(r!=null)put(r,W-M,'right',o.c);y+=k(o.h||46)}
    function section(t,head){need(120);y+=k(30);font(600,22);put(t,M,'left',MUTED);y+=k(12);rule(INK,3);y+=k(34);
      if(head){font(600,22);put(head[0],M,'left',MUTED);if(head[1])put(head[1],W-M-250,'right',MUTED);put(head[2],W-M,'right',MUTED);y+=k(12);rule();y+=k(30)}}
    function table(map){Object.keys(map).sort(function(a,b){return map[b].qty-map[a].qty}).forEach(function(kk){row(kk,String(map[kk].qty),fmt(map[kk].amt))})}
    function draw(){
      pages=[];newPage();

  async function openPrinter(dev){

    }

    for(var i=0;i<PSVC.length&&!ch;i++){
      try{var svc=await server.getPrimaryService(PSVC[i]),cs=await svc.getCharacteristics();
        for(var j=0;j<cs.length;j++){if(cs[j].properties.writeWithoutResponse||cs[j].properties.write){ch=cs[j];break}}}catch(e){}
    }
    if(!ch){try{dev.gatt.disconnect()}catch(e){}throw {code:'nochar'}}
    printer=dev;pchar=ch;
    if(!dev._smashL){dev._smashL=true;dev.addEventListener('gattserverdisconnected',function(){pchar=null;renderOrder()})}
  }

      '<button class="btn wide" style="margin-top:8px" data-act="ptest">พิมพ์ทดสอบ</button>'+
      (lastBtErr?'<p class="hint" style="margin-top:12px;color:var(--bad);white-space:pre-line">'+esc(lastBtErr)+'</p>':'')+
      '<p class="hint" style="margin-top:12px">เปิดเครื่องพิมพ์ไว้ก่อนกดค้นหา ใช้ได้กับ Chrome บน Android/คอมพิวเตอร์ และเครื่องพิมพ์แบบ Bluetooth LE ถ้าเชื่อมต่อไม่ได้ ระบบจะบันทึกใบออเดอร์เป็นรูปให้แทน</p>');
  }

  /* ---------- events ---------- */
  document.addEventListener('click',function(e){
    var el=e.target.closest('[data-act]');if(!el)return;
    var a=el.dataset.act;
    if(a==='tab')setTab(el.dataset.t);
    else if(a==='mode'){mode=el.dataset.m;renderOrder()}
    else if(a==='vtog'){var vi=draft.veg.indexOf(el.dataset.v);if(vi>-1)draft.veg.splice(vi,1);else draft.veg.push(el.dataset.v);renderOpt()}
    else if(a==='quick'){addLine(el.dataset.b,1,{},[]);renderOrder();draft={b:el.dataset.b,qty:1,add:{},veg:[],quick:true};renderOpt()}
    else if(a==='open'){draft={b:el.dataset.b,qty:1,add:{},veg:[]};renderOpt()}
    else if(a==='oinc'){var k=el.dataset.k;draft.add[k]=(draft.add[k]||0)+1;renderOpt()}
    else if(a==='odec'){var k2=el.dataset.k;if(draft.add[k2]>0)draft.add[k2]--;renderOpt()}
    else if(a==='qinc'){draft.qty++;renderOpt()}
    else if(a==='qdec'){if(draft.qty>1)draft.qty--;renderOpt()}
    else if(a==='oadd'){if(draft.quick){var ps=sig(draft.b,{},[]);for(var qi=0;qi<cart.length;qi++){if(sig(cart[qi].b,cart[qi].add,cart[qi].veg)===ps){cart[qi].qty--;if(cart[qi].qty<1)cart.splice(qi,1);break}}}addLine(draft.b,draft.qty,draft.add,draft.veg);var nm=BURGER[draft.b].name;closeSheet();renderOrder();toast('เพิ่ม '+nm+' แล้ว')}
    else if(a==='linc'){cart[+el.dataset.i].qty++;renderOrder()}
    else if(a==='ldec'){var i=+el.dataset.i;cart[i].qty--;if(cart[i].qty<1)cart.splice(i,1);renderOrder()}
    else if(a==='clear'){cart=[];cust='';renderOrder();toggleOrder(false)}
    else if(a==='toggleOrder')toggleOrder();
    else if(a==='pay'){if(cart.length){pay={method:'cash',recv:''};renderPay()}}
    else if(a==='method'){pay.method=el.dataset.m;renderPay()}
    else if(a==='recv'){pay.recv=el.dataset.v;renderPay()}
    else if(a==='key'){
      var v=el.dataset.v,s=String(pay.recv||'');
      if(v==='C')s='';else if(v==='⌫')s=s.slice(0,-1);else if(s.length<7)s=(s+v).replace(/^0+(?=\d)/,'');
      pay.recv=s;updatePay();
    }
    else if(a==='pdf')savePdf(el);
    else if(a==='shareOrder'){var so=orders.filter(function(o){return o.id===+el.dataset.id})[0];if(so)shareTicket(so,el)}
    else if(a==='printCart'){if(cart.length)printTicket(cartTicket(),el)}
    else if(a==='printOrder'){var po=orders.filter(function(o){return o.id===+el.dataset.id})[0];if(po)printTicket(po,el)}
    else if(a==='pset')renderPset();
    else if(a==='pw'){PW=+el.dataset.w===80?80:58;save('smash.pw',PW);renderPset();renderOrder()}
    else if(a==='pconn')connectOnly();
    else if(a==='ptest')printTicket({title:'ทดสอบเครื่องพิมพ์',ts:Date.now(),lines:[{name:'สแมชเบอร์เกอร์เนื้อ',qty:1,veg:['ผักกาดแก้ว','มะเขือเทศ'],add:[{name:'เพิ่มไข่',qty:1}]}]},el);
    else if(a==='confirm')confirmPay();
    else if(a==='close')closeSheet();
    else if(a==='delbill'){
      if(el.dataset.arm){
        var id=+el.dataset.id;orders=orders.filter(function(o){return o.id!==id});save('smash.orders',orders);renderBadge();renderSummary();
      }else{
        el.dataset.arm='1';el.classList.add('arm');el.textContent='กดอีกครั้งเพื่อลบ';
        setTimeout(function(){if(el.isConnected){delete el.dataset.arm;el.classList.remove('arm');el.textContent='ลบบิลนี้'}},3000);
      }
    }
  });
  document.addEventListener('input',function(e){
    if(e.target.id==='recv'&&pay){pay.recv=e.target.value;updatePay()}
    else if(e.target.id==='cust'){cust=e.target.value}
  });
  var opened=[];
  window.addEventListener('beforeprint',function(){
    opened=[];Array.prototype.forEach.call(document.querySelectorAll('#v-sum details'),function(d){if(!d.open){d.open=true;opened.push(d)}});
  });
  window.addEventListener('afterprint',function(){opened.forEach(function(d){d.open=false});opened=[]});
  $('ov').addEventListener('click',function(e){if(e.target===$('ov'))closeSheet()});
  document.addEventListener('keydown',function(e){if(e.key==='Escape'){if(!$('ov').hidden)closeSheet();else toggleOrder(false)}});

  $('today').textContent=new Date().toLocaleDateString('th-TH',{weekday:'long',day:'numeric',month:'long'});
  renderMenu();renderOrder();renderBadge();
})();
</script>

</body></html>
